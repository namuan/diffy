[project]
name = "diffy"
version = "0.1.0"
description = "Native macOS pull request review tool powered by PySide6 and gh CLI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Developer", email = "dev@example.com" }
]
dependencies = [
    "pyside6>=6.6.0",
    "pygments>=2.17.0",
    "shiboken6>=6.6.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.3.0",
]

[project.scripts]
diffy = "diffy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diffy"]

[tool.pyinstaller]
app_name = "diffy"
bundle_id = "com.diffy.desktop"
entry_point = "diffy/__main__.py"
icon_path = "assets/AppIcon.icns"
target_arch = "arm64"
